name: Main CI Slack alerts

on:
  workflow_run:
    workflows: ['*']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3,15 * * *' # 03:00 UTC and 15:00 UTC.

permissions:
  actions: read

jobs:
  notify:
    uses: contentauth/ci-workflows/.github/workflows/ci-slack.yml@d8fc3f18fb41d14da72feded31923c8e6b9f6b70
    with:
      branch: main
      workflow-names: '["*"]'
      caller-workflow-path: .github/workflows/main-ci-slack.yml
      test-delivery: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
