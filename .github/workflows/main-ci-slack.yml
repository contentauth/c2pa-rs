name: Main CI Slack alerts

on:
  workflow_run:
    workflows: ['*']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3,15 * * *' # 7am and 7pm PST (fixed UTC-8).

permissions:
  actions: read

jobs:
  notify:
    uses: contentauth/ci-workflows/.github/workflows/ci-slack.yml@222dad43ad9c5a6ad808165326194efd016da0f3
    with:
      branch: main
      workflow-names: '["*"]'
      caller-workflow-path: .github/workflows/main-ci-slack.yml
      test-delivery: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
