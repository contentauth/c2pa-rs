name: Semver checks

on:
  pull_request:
    branches:
      - v0.89

permissions:
  contents: read

jobs:
  semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: c2pa, c2pa-c-ffi
          # Maintenance APIs must remain compatible with this line, not newer SDKs.
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          release-type: patch
