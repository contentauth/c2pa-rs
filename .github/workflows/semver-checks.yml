name: Semver checks

# Enforces the additive-track contract: a change that ships as an additive
# (0.x.y) release must NOT be an accidental breaking change. This runs on every
# PR targeting a release-line branch -- including backport PRs opened by
# backport.yml -- and baselines the public API against the latest crates.io
# release.
#
# This deliberately does NOT run on release-candidate (`*-rc*`) branches: the
# breaking train IS the intended place for breaking changes.

on:
  pull_request:
    branches:
      - stable
      - 'v0.*'

permissions:
  contents: read

jobs:
  semver-checks:
    name: cargo-semver-checks

    # cargo-semver-checks compiles the PR's code, so untrusted fork PRs must not
    # run it unreviewed. That trust gate is enforced by GitHub's "Fork pull
    # request workflows from outside collaborators" Actions setting (see
    # tier-1a.yml) rather than in this workflow.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      # Published 0.91.2 requires yanked zip 8.6.0. Supply the unchanged archive
      # to the baseline's resolver; the PR's zip 9.x requirement is unaffected.
      # Remove once the published baseline no longer requires zip 8.6.0.
      - name: Make yanked baseline dependency available
        shell: bash
        run: |
          set -euo pipefail
          vendor_dir="$RUNNER_TEMP/semver-baseline-deps"
          mkdir -p "$vendor_dir"
          curl --fail --location --retry 3 \
            https://static.crates.io/crates/zip/zip-8.6.0.crate \
            --output "$vendor_dir/zip-8.6.0.crate"
          echo "2d04a6b5381502aa6087c94c669499eb1602eb9c5e8198e534de571f7154809b  $vendor_dir/zip-8.6.0.crate" \
            | sha256sum -c -
          tar -xzf "$vendor_dir/zip-8.6.0.crate" -C "$vendor_dir"
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [patch.crates-io]
          zip = { path = "$vendor_dir/zip-8.6.0" }
          EOF

      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # Public-API library crates.
          package: c2pa, c2pa-c-ffi
