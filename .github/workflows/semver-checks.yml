name: Semver checks

# Enforces the additive-track contract: a change that ships as an additive
# (0.x.y) release must NOT be an accidental breaking change. This runs on every
# PR targeting a release-line branch -- including backport PRs opened by
# backport.yml -- and baselines the public API against the latest crates.io
# release.
#
# This deliberately does NOT run on release-candidate (`*-rc*`) branches: the
# breaking train IS the intended place for breaking changes.

on:
  pull_request:
    branches:
      - stable
      - 'v0.*'

permissions:
  contents: read

jobs:
  semver-checks:
    name: cargo-semver-checks

    # cargo-semver-checks compiles the PR's code, so untrusted fork PRs must not
    # run it unreviewed. That trust gate is enforced by GitHub's "Fork pull
    # request workflows from outside collaborators" Actions setting (see
    # tier-1a.yml) rather than in this workflow.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # Public-API library crates.
          package: c2pa, c2pa-c-ffi
