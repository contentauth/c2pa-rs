name: PKI experiment

on:
  push:
    paths:
      - 'contentauth-pki/**'
      - 'sdk/src/crypto/**'
      - 'sdk/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/contentauth-pki.yml'
  pull_request:
    paths:
      - 'contentauth-pki/**'
      - 'sdk/src/crypto/**'
      - 'sdk/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/contentauth-pki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test the independent default and compatibility surfaces
        run: |
          cargo test -p contentauth-pki
          cargo test -p contentauth-pki --features sdk-compat
          cargo test -p contentauth-pki --no-default-features --features openssl
          cargo test -p contentauth-pki --no-default-features --features openssl,sdk-compat
      - name: Lint both crate surfaces and the SDK adapter
        run: |
          cargo clippy -p contentauth-pki --all-targets -- -D warnings
          cargo clippy -p contentauth-pki --all-targets --features sdk-compat -- -D warnings
          cargo clippy -p contentauth-pki --all-targets --no-default-features --features openssl,sdk-compat -- -D warnings
          cargo clippy -p c2pa --all-targets -- -D warnings
      - name: Check documentation
        run: |
          RUSTDOCFLAGS='-D warnings' cargo doc -p contentauth-pki --no-deps
          RUSTDOCFLAGS='-D warnings' cargo doc -p contentauth-pki --features sdk-compat --no-deps --document-private-items
      - name: Check WebAssembly portability
        run: |
          cargo check -p contentauth-pki --target wasm32-unknown-unknown
          cargo check -p contentauth-pki --target wasm32-wasip2
          cargo check -p c2pa --no-default-features --features rust_native_crypto --target wasm32-unknown-unknown
      - name: Test SDK crypto compatibility
        run: |
          cargo test -p c2pa --lib crypto::
      - name: Test SDK crypto with Rust-native cryptography
        run: cargo test -p c2pa --no-default-features --features rust_native_crypto --lib crypto::
