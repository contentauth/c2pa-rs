name: Release-plz prepare PR

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-no-patch-deps:
    name: Guard against patch/git dependencies
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/heads/v0.')) &&
      !contains(github.ref_name, '-rc')
    uses: ./.github/workflows/check-no-patch-deps.yml

  release-pr:
    name: Prepare release PR
    needs: guard-no-patch-deps
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/heads/v0.')) &&
      !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Scope release-plz to this release line
        run: python3 .github/scripts/release_plz_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz (release-pr)
        uses: MarcoIeni/release-plz-action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release-pr
          config: ${{ runner.temp }}/release-plz.toml
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
