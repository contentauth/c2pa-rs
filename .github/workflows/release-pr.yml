name: Release-plz PR

# Opens/updates the version-bump + changelog "release PR" on a release-line
# branch by manual dispatch. Automatic stable preparation runs after publishing
# in release.yml. Merging a release PR triggers publishing only on stable.
# For a breaking train, this prepares the 0.(x+1).0 bump
# once the release-candidate branch has been promoted (merged) into stable.
#
# Release-candidate branches themselves do not run release-plz; they only bake
# under the Tier CI suites. This runs release-plz `release-pr` ONLY -- it never
# publishes. Publishing is handled separately by release.yml.
# See docs/release-process.md.

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-no-patch-deps:
    name: Guard against patch/git dependencies
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/heads/v0.')) &&
      !contains(github.ref_name, '-rc')
    uses: ./.github/workflows/check-no-patch-deps.yml

  release-pr:
    name: Release-plz PR
    needs: guard-no-patch-deps
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/heads/v0.')) &&
      !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz (release-pr)
        uses: MarcoIeni/release-plz-action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release-pr
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
