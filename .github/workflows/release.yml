name: Release-plz publish

# Publishes crates to crates.io and creates GitHub releases/tags.
#
# Under the open-source release process (see docs/release-process.md), crates
# are published ONLY from release-line branches -- never from `main` (which is
# nightly-like and intentionally unpublished) and never from release-candidate
# branches (which bake before promotion). A push to a release-line branch
# happens when a release-plz release PR (see release-pr.yml) is merged.
#
# release-plz creates the `c2pa-v*` tag here; that tag then drives the binary
# builds in library-release.yml. This workflow no longer builds binaries
# itself -- keeping binary builds tag-driven means release-candidate builds
# (which never reach this workflow) produce the same binaries via
# release-rc.yml's tags.
#
# When the `c2pa` crate itself is among the packages published, this also
# dispatches a cross-repo notification (repository_dispatch, authenticated
# with the shared RELEASE_PLZ_ORG_TOKEN org token) so contentauth/c2patool can
# immediately open a PR bumping its `stable` branch's `c2pa` dependency,
# instead of waiting for a scheduled poll. See c2patool's
# docs/release-process.md, "c2pa-rs release bump".

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - stable # currently-active release line
      - 'v0.*' # long-lived per-line branches (backports to retired lines)

jobs:
  # Refuse to publish if a [patch]/git dependency is present. Such deps are used
  # only transiently while co-developing an extracted crate (e.g.
  # c2pa_cbor); they must be settled to a published version before any
  # release, because crates.io requires every dependency to resolve to a
  # published version.
  guard-no-patch-deps:
    name: Guard against patch/git dependencies
    uses: ./.github/workflows/check-no-patch-deps.yml

  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    needs: guard-no-patch-deps
    # Defense in depth: release-candidate branches must never publish, even if
    # one were ever added to the triggers above. RC branches are named
    # `<version>-rc` (no numeric suffix), so match on `-rc` rather than `-rc.`.
    if: ${{ !contains(github.ref_name, '-rc') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable

      # Make cargo-semver-checks available so release-plz uses it as an extra
      # guard against an accidental breaking change shipping as an additive
      # (0.x.y) release. (The hard gate is semver-checks.yml on the release PR.)
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-semver-checks

      - name: Run release-plz (publish)
        id: release-plz
        uses: MarcoIeni/release-plz-action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_ORG_TOKEN }}

      - name: Debug release-plz outputs
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "=== Release-plz releases ==="
          echo "$RELEASES"
          echo "==========================="

      # `releases` is a JSON array of every package release-plz just published
      # (this repo hosts several crates); only a `c2pa` entry is relevant to
      # c2patool. Silently does nothing on a release batch that doesn't
      # include `c2pa` (e.g. a c2pa-crypto-only release).
      - name: Notify c2patool of a new c2pa release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          VERSION=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "c2pa") | .version')
          if [ -z "$VERSION" ]; then
            echo "No 'c2pa' crate in this release batch; nothing to notify."
            exit 0
          fi
          echo "Dispatching c2patool release-bump for c2pa $VERSION"
          gh api repos/contentauth/c2patool/dispatches \
            -f event_type=c2pa-rs-release \
            -F "client_payload[version]=$VERSION"
