[package]
name = "c2pa-claim-builder"

version.workspace = true

description = "Direct, eager Claim-construction API for c2pa (ClaimBuilder/StoreReader), as a narrow crate independent of the full c2pa Builder/Manifest/Reader API"
authors = ["Gavin Peacock <gpeacock@adobe.com>"]
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/c2pa-claim-builder"
homepage = "https://contentauthenticity.org"
repository = "https://github.com/contentauth/c2pa-rs"
keywords = ["metadata", "provenance"]
categories = ["api-bindings"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "c2pa_claim_builder"

[features]
default = ["openssl", "default_http"]
openssl = ["c2pa/openssl"]
rust_native_crypto = ["c2pa/rust_native_crypto"]
default_http = ["c2pa/default_http"]
file_io = ["c2pa/file_io"]
pdf = ["c2pa/pdf"]
json_schema = ["c2pa/json_schema"]

[dependencies]
c2pa = { workspace = true, default-features = false }
