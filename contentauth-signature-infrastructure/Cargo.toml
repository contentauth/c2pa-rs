[package]
name = "contentauth-signature-infrastructure"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
description = "Experimental sans-I/O signature infrastructure"
readme = "README.md"
publish = false

[features]
# Provisional bridge until timestamp verification moves out of the SDK.
sdk-compat = []

[dependencies]
bcder = "0.7.6"
bytes = "1.11.1"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
contentauth-sans-io-core = "0.2.0"
der = { version = "0.8.1", features = ["alloc", "std", "oid"] }
hex = "0.4.3"
http = "1.4.1"
rasn = "0.28.13"
rasn-cms = "0.28.13"
sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
pem = "4.0.0"
